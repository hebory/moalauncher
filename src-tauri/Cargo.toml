[package]
name = "moalauncher"
version = "0.3.0"
description = "모아 프로그램 설치 및 업데이트 런처"
edition = "2021"
default-run = "MoaLauncher"

[lib]
name = "moalauncher_lib"
crate-type = ["rlib"]

[[bin]]
name = "MoaLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
dunce = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
semver = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sysinfo = "0.37"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
