name: Windows CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MoaLauncher.sln
      - run: dotnet build MoaLauncher.sln -c Release --no-restore
      - run: dotnet test MoaLauncher.sln -c Release --no-build --logger "console;verbosity=normal"
      - run: dotnet run --project tests/MoaLauncher.App.SmokeTests -c Release --no-build
      - run: dotnet run --project tests/MoaLauncher.App.SmokeTests -c Release --no-build -- --background

  rust-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Run Rust lint
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Build Windows desktop executable
        run: cargo build --locked --manifest-path native/Cargo.toml --release
