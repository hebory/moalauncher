name: Publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MoaLauncher.sln
      - run: dotnet build MoaLauncher.sln -c Release --no-restore
      - run: dotnet test MoaLauncher.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Run launcher smoke checks
        shell: pwsh
        run: |
          dotnet run --project tests/MoaLauncher.App.SmokeTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Normal launcher smoke check failed.' }
          dotnet run --project tests/MoaLauncher.App.SmokeTests -c Release --no-build -- --background
          if ($LASTEXITCODE -ne 0) { throw 'Background launcher smoke check failed.' }
      - name: Check tag and app version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Release tag must use vMAJOR.MINOR.PATCH; found '$tag'." }
          $tagVersion = $Matches[1]
          [xml]$project = Get-Content Directory.Build.props
          $version = [string]$project.Project.PropertyGroup.Version
          if (!$version) { throw 'Directory.Build.props에 Version이 없습니다.' }
          if ($tagVersion -ne $version) { throw "Tag $tagVersion does not match project version $version. Update the project version before tagging." }
          "MOA_RELEASE_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Find Inno Setup Compiler
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($candidates.Count -eq 0) { throw 'Inno Setup 6 ISCC.exe was not found on this runner.' }
          "MOA_ISCC_PATH=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish ZIP, installer, and checksums
        shell: pwsh
        run: ./scripts/Publish.ps1 -Version $env:MOA_RELEASE_VERSION -IsccPath $env:MOA_ISCC_PATH
      - name: Upload GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = 'artifacts/distribution'
          $archive = "$dist/moa-launcher-$env:MOA_RELEASE_VERSION-windows-x64.zip"
          $installer = "$dist/MoaLauncher-$env:MOA_RELEASE_VERSION-Setup-x64.exe"
          $assets = @($archive, "$archive.sha256", $installer, "$installer.sha256", "$dist/SHA256SUMS.txt")
          $checksums = 'artifacts/distribution/SHA256SUMS.txt'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseJson = gh release view $env:GITHUB_REF_NAME --json assets 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh release create $env:GITHUB_REF_NAME @assets --title "Moa Launcher $env:MOA_RELEASE_VERSION" --notes "Moa Launcher $env:MOA_RELEASE_VERSION Windows 배포입니다.`n`n포터블 ZIP과 사용자별 설치 프로그램을 제공합니다. SHA-256 체크섬을 확인한 뒤 실행하세요."
            } else {
              $existing = ($releaseJson | ConvertFrom-Json).assets | ForEach-Object { $_.name }
              $duplicates = @($assets | ForEach-Object { Split-Path $_ -Leaf } | Where-Object { $existing -contains $_ })
              if ($duplicates.Count -gt 0) { throw "Release already contains asset(s): $($duplicates -join ', '). Existing release assets are never overwritten." }
              gh release upload $env:GITHUB_REF_NAME @assets
              if ($LASTEXITCODE -ne 0) { throw 'GitHub Release asset upload failed.' }
            }
          } else {
            throw 'Manual release publishing must run from a version tag (vMAJOR.MINOR.PATCH).'
          }
