name: Publish Rust Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install npm dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --passWithNoTests
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify tag and project versions
        shell: pwsh
        run: |
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch '(?ms)^\[package\]\s*.*?^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"') { throw 'Cargo package version is missing.' }
          $version = $Matches.version
          $tauri = [string](Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = [string](Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.3.0' -or $tauri -ne $version -or $npm -ne $version) { throw "Rust, Tauri, and npm versions must all be 0.3.0; found $version/$tauri/$npm." }
          if ($env:GITHUB_REF -match '^refs/tags/') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Release tag must use vMAJOR.MINOR.PATCH; found '$env:GITHUB_REF_NAME'." }
            if ($Matches[1] -ne $version) { throw "Tag version $($Matches[1]) does not match app version $version." }
          }
          "MOA_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows desktop executable
        run: npm run desktop:build
      - name: Find Inno Setup Compiler
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($candidates.Count -eq 0) { throw 'Inno Setup 6 ISCC.exe was not found on this runner.' }
          "MOA_ISCC_PATH=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package Rust launcher
        shell: pwsh
        run: ./scripts/Publish-Rust.ps1 -Version $env:MOA_RELEASE_VERSION -IsccPath $env:MOA_ISCC_PATH
      - name: Store packages for verification or publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moa-launcher-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rust-distribution/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: moa-launcher-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rust-distribution
      - name: Verify unique tag and package checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Release tag must use vMAJOR.MINOR.PATCH; found '$tag'." }
          $version = $Matches[1]
          $dist = 'artifacts/rust-distribution'
          $archiveName = "moa-launcher-$version-windows-x64.zip"
          $installerName = "MoaLauncher-$version-Setup-x64.exe"
          $expected = @($archiveName, "$archiveName.sha256", $installerName, "$installerName.sha256", 'SHA256SUMS.txt') | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $dist -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) { throw "Unexpected release artifact set: $($actual -join ', ')" }
          foreach ($name in @($archiveName, $installerName)) {
            $asset = Join-Path $dist $name
            $actualHash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            $sidecar = (Get-Content -LiteralPath "$asset.sha256" -Raw).Trim()
            if ($sidecar -notmatch "^$actualHash\s+$([regex]::Escape($name))$") { throw "Checksum sidecar mismatch for $name." }
          }
          $sumLines = Get-Content -LiteralPath (Join-Path $dist 'SHA256SUMS.txt')
          if ($sumLines.Count -ne 2) { throw 'SHA256SUMS.txt must contain exactly two entries.' }
          foreach ($line in $sumLines) {
            if ($line -notmatch '^([a-f0-9]{64}) \*(.+)$') { throw 'SHA256SUMS.txt format is invalid.' }
            $name = $Matches[2]
            if ($name -notin @($archiveName, $installerName)) { throw "Unexpected file in SHA256SUMS.txt: $name" }
            $actualHash = (Get-FileHash -LiteralPath (Join-Path $dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Matches[1] -ne $actualHash) { throw "SHA256SUMS.txt checksum mismatch for $name." }
          }
          $releaseJson = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; existing releases are not overwritten." }
          if ($LASTEXITCODE -ne 1) { throw 'Unable to check for an existing GitHub Release.' }
      - name: Publish verified packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $dist = 'artifacts/rust-distribution'
          gh release create $tag `
            "$dist/moa-launcher-$version-windows-x64.zip" `
            "$dist/moa-launcher-$version-windows-x64.zip.sha256" `
            "$dist/MoaLauncher-$version-Setup-x64.exe" `
            "$dist/MoaLauncher-$version-Setup-x64.exe.sha256" `
            "$dist/SHA256SUMS.txt" `
            --verify-tag --title "Moa Launcher $version" `
            --notes "Moa Launcher $version Windows 배포입니다.`n`nRust + Tauri 2 런처의 ZIP과 설치 프로그램입니다. SHA-256 체크섬은 SHA256SUMS.txt에서 확인할 수 있습니다."
